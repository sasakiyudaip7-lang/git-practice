name: Python Test

on: [push] # Pushされたら自動で動く設定

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install fastapi httpx pytest
      - name: Run tests
        run: pytest